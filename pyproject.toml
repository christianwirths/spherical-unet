[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spherical-unet"
dynamic = ["version"]
description = "Spherical graph U-Net for fields on regular latitude-longitude grids (diffusion, consistency and flow-matching backbone)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Wirths" }]
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
legacy = ["scipy"]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "spherical_unet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
